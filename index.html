<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

  <title>Gplat Game Center</title>
  <meta name="description" content="داشبورد سیستم Gplat Game Center">
  <meta property="og:title" content="Gplat Game Center">
  <meta property="og:description" content="داشبورد سیستم Gplat Game Center">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --background: #0c0900;
      --surface: rgba(12, 9, 0, 0.78);
      --gold: #ffb81c;
      --gold-light: #ffd24d;
      --border: rgba(255, 184, 28, 0.32);
      --subtle-border: rgba(255, 184, 28, 0.15);
      --warning-background: rgba(255, 184, 28, 0.055);
      --text-muted: #bba66e;
      --radius: 8px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--gold-light);
      font-family: "Vazirmatn", Tahoma, sans-serif;
      line-height: 1.9;
      letter-spacing: 0;
    }

    body::before {
      content: "";
      display: block;
      flex: 0 0 3px;
      background: var(--gold);
    }

    main {
      width: min(100%, 880px);
      margin-inline: auto;
      padding: 64px 24px 48px;
    }

    h1 {
      margin: 0 0 28px;
      color: var(--gold-light);
      font-family: "Vazirmatn", Arial, sans-serif;
      font-size: 42px;
      font-weight: 900;
      line-height: 1.4;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .warning {
      margin: 0;
      padding: 20px 24px;
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--gold);
      border-radius: var(--radius);
      background: var(--warning-background);
      color: var(--gold-light);
      font-size: 14px;
      font-weight: 500;
      text-align: right;
    }

    .warning strong {
      color: var(--gold);
      font-weight: 800;
    }

    .host-subtitle {
      margin: -18px 0 28px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .contact-address {
      margin: 14px 0 0;
      color: var(--gold-light);
      font-size: 13px;
      font-style: normal;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .console-region {
      margin-top: 32px;
    }

    .console-label {
      margin: 0 0 8px;
      color: var(--text-muted);
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      font-weight: 400;
      line-height: 1.5;
      text-align: left;
    }

    #console {
      width: 100%;
      height: 78px;
      padding: 9px 12px;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid var(--subtle-border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--gold-light);
      direction: ltr;
      text-align: left;
      font-family: Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 10px;
      font-weight: 400;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--background);
    }

    #console::-webkit-scrollbar {
      width: 4px;
    }

    #console::-webkit-scrollbar-track {
      background: var(--background);
    }

    #console::-webkit-scrollbar-thumb {
      border-radius: 4px;
      background: var(--border);
    }

    #console:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    footer {
      width: min(calc(100% - 48px), 832px);
      margin: auto auto 0;
      padding: 22px 0 28px;
      border-top: 1px solid var(--subtle-border);
      color: var(--gold);
      text-align: center;
      font-size: 13px;
    }

    .contact-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 32px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .contact-list li {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    a {
      color: var(--gold-light);
      text-decoration: none;
      text-underline-offset: 5px;
    }

    a:hover {
      text-decoration: underline;
    }

    bdi {
      unicode-bidi: isolate;
    }

    @media (max-width: 480px) {
      main {
        padding: 42px 20px 36px;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 24px;
      }

      .warning {
        padding: 16px 18px;
        font-size: 13px;
      }

      footer {
        width: calc(100% - 40px);
        padding-bottom: 24px;
      }

      .contact-list {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1 dir="ltr">Gplat Game Center</h1>
      <p class="host-subtitle" dir="ltr">ps5 host 7.00 13.60</p>

      <p class="warning" role="note">
        <strong>توجه:</strong>
        انجام این عملیات دارای ریسک است و مسئولیت انجام آن تماماً بر عهده کاربر می‌باشد.
      </p>
    </header>

    <section class="console-region" aria-labelledby="console-label">
      <h2 id="console-label" class="console-label" dir="ltr">SYSTEM LOG</h2>
      <div
        id="console"
        dir="ltr"
        role="log"
        aria-label="گزارش سیستم"
        aria-live="polite"
        aria-relevant="additions text"
        tabindex="0"
      ></div>
    </section>
  </main>

  <footer>
    <ul class="contact-list">
      <li>
        <span>شماره تماس:</span>
        <a href="tel:09108683559">
          <bdi dir="ltr">۰۹۱۰۸۶۸۳۵۵۹</bdi>
        </a>
      </li>
      <li>
        <span>پیج اینستاگرام:</span>
        <a
          href="https://www.instagram.com/Gplat_GC/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <bdi dir="ltr">@Gplat_GC</bdi>
        </a>
      </li>
    </ul>
    <address class="contact-address">پاکدشت بلوار اموزش و پرورش جنب اموزش پرورش گیم سنتر جی پلات</address>
  </footer>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
